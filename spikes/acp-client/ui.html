<!doctype html>
<html><head><meta charset="utf-8"><title>Oscine · assistant (ACP spike)</title>
<style>
  :root { color-scheme: dark; --bg:#141418; --panel:#1d1d24; --line:#2e2e3a; --fg:#e6e6ee; --dim:#8a8aa0; --acc:#7cc4ff; --ok:#6fd49a; --bad:#ff7a7a; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); color:var(--dim); font-size:12px; }
  header b { color:var(--fg); }
  #log { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px; max-width:760px; width:100%; margin:0 auto; box-sizing:border-box; }
  .user { align-self:flex-end; background:#2a3550; padding:8px 12px; border-radius:10px; max-width:80%; }
  .agent { white-space:pre-wrap; }
  .tool { border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:6px 10px; font:12px ui-monospace, monospace; }
  .tool .st { float:right; color:var(--dim); } .tool .st.completed { color:var(--ok); } .tool .st.failed { color:var(--bad); }
  .perm { border:1px solid var(--acc); background:#1a2433; border-radius:8px; padding:10px; }
  .perm button { margin:6px 6px 0 0; padding:4px 12px; border-radius:6px; border:1px solid var(--line); background:#26263a; color:var(--fg); cursor:pointer; }
  .perm button.allow { border-color:var(--ok); } .perm button.reject { border-color:var(--bad); }
  .perm.done { opacity:.6; border-color:var(--line); }
  .plan { border-left:3px solid var(--acc); padding-left:8px; color:var(--dim); font-size:12px; }
  .meta { color:var(--dim); font-size:11px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); max-width:760px; width:100%; margin:0 auto; box-sizing:border-box; }
  input { flex:1; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; }
  form button { background:var(--acc); color:#000; border:0; border-radius:8px; padding:0 16px; font-weight:600; }
</style></head>
<body>
<header><b>Oscine assistant</b> · ACP spike · agent <span id="agent">…</span> · <span id="sid" class="meta"></span></header>
<div id="log"></div>
<form id="f"><input id="q" placeholder="Ask the agent… (e.g. call oscine_status)" autocomplete="off"><button>Send</button></form>
<script>
const log = document.getElementById('log');
const el = (cls, html) => { const d = document.createElement('div'); d.className = cls; if (html != null) d.innerHTML = html; log.append(d); log.scrollTop = 1e9; return d; };
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));
let msg = null; const tools = new Map();
const es = new EventSource('/events');
es.onmessage = (e) => {
  const ev = JSON.parse(e.data);
  if (ev.type === 'hello') document.getElementById('agent').textContent = ev.agent;
  else if (ev.type === 'session') document.getElementById('sid').textContent = ev.sessionId;
  else if (ev.type === 'turn_start') msg = null;
  else if (ev.type === 'turn_end') { el('meta', 'stopReason: ' + esc(ev.stopReason)); msg = null; }
  else if (ev.type === 'error') el('meta', '⚠ ' + esc(ev.message));
  else if (ev.type === 'update') {
    const u = ev.update;
    if (u.sessionUpdate === 'agent_message_chunk') { if (!msg) msg = el('agent', ''); msg.textContent += u.content?.text ?? ''; }
    else if (u.sessionUpdate === 'tool_call') { msg = null; const d = el('tool'); d.dataset.id = u.toolCallId; tools.set(u.toolCallId, { d, title: u.title, kind: u.kind, status: u.status }); paint(u.toolCallId); }
    else if (u.sessionUpdate === 'tool_call_update') { const t = tools.get(u.toolCallId); if (t) { if (u.title) t.title = u.title; if (u.status) t.status = u.status; paint(u.toolCallId); } }
    else if (u.sessionUpdate === 'plan') { msg = null; el('plan', (u.entries || []).map((p) => `${p.status === 'completed' ? '☑' : '☐'} ${esc(p.content)}`).join('<br>')); }
  }
  else if (ev.type === 'permission') {
    msg = null; const tc = ev.request.toolCall || {};
    const d = el('perm', `<div>Agent wants to run <b>${esc(tc.title)}</b> <span class="meta">(${esc(tc.kind)})</span></div>`);
    for (const o of ev.request.options) {
      const b = document.createElement('button'); b.textContent = o.name; b.className = o.kind.startsWith('allow') ? 'allow' : 'reject';
      b.onclick = async () => { d.classList.add('done'); d.querySelectorAll('button').forEach((x) => (x.disabled = true)); d.append(Object.assign(document.createElement('div'), { className: 'meta', textContent: '→ ' + o.name }));
        await fetch('/permission', { method: 'POST', body: JSON.stringify({ id: ev.id, optionId: o.optionId }) }); };
      d.append(b);
    }
  }
};
function paint(id) { const t = tools.get(id); t.d.innerHTML = `<span class="st ${esc(t.status)}">${esc(t.status || 'pending')}</span>🔧 ${esc(t.title)} <span class="meta">${esc(t.kind)}</span>`; }
document.getElementById('f').onsubmit = (e) => { e.preventDefault(); const q = document.getElementById('q'); if (!q.value.trim()) return;
  el('user').textContent = q.value; fetch('/prompt', { method: 'POST', body: JSON.stringify({ text: q.value }) }); q.value = ''; };
</script>
</body></html>
